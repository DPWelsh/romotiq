<!-- 01 · orbit — cards burst out of the speaker's hands, then ride a tilted ring around them; the far
     half goes BEHIND them (dimmed, blurred), the near half passes in FRONT below the chin.
     ✅ rendered 16 Oct 2026. Measured on reference reels: 6 cards, 60° apart, ~175°/s, depth scale
     0.6–1.0, back cards brightness .8 + blur 3px, burst from the hands in 0.25 s.
     Paste: CSS into <style>, <div id="cards"> inside #cam (each card sets z-index 1 or 3
     around #fg's 2), JS into the timeline.
     Params: T, DUR, SPEED (deg/s), CX (subject.json head_cx), CY, RX, RY, BURST [x,y] (hands),
     ITEMS = [{img}|{num,lab}] — real reel thumbnails beat number cards.
     Geometry rule: CY + RY must land BELOW the chin or near cards cross the face. On a
     close take (face ~30% of frame height) RY 120 crossed the face; RY 330 cleared it.
     The reference reels sit further back (face ~15%), with RY ~150.
     Limit: the ring is fixed in the frame; it won't follow the person if they move a lot. -->

<style>
  .card {
    position: absolute; left: 0; top: 0; width: 190px; height: 330px;
    margin-left: -95px; margin-top: -165px;
    border-radius: 24px; background: var(--cloud); overflow: hidden;
    border: 5px solid #e8e3dc; box-shadow: 0 16px 36px rgba(26, 28, 18, 0.3);
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .bar { display: block; height: 70px; background: var(--indigo); }
  .card .num { display: block; padding: 22px 18px 0; font-family: var(--mono); font-weight: 700; font-size: 44px; color: var(--core); }
  .card .lab { display: block; padding: 8px 18px 0; font-family: var(--mono); font-weight: 500; font-size: 22px; color: var(--blackberry); }
</style>

<div id="cards"></div>

<script>
  (function orbit({ T = 2.75, DUR = 3.0, SPEED = 175, CX = 540, CY = 1000, RX = 440, RY = 330,
                    BURST = [560, 1500], BURST_DUR = 0.25,
                    ITEMS = [{ num: "2x", lab: "BONUS PTS" }, { num: "10M", lab: "WEEKLY" }, { num: "APP", lab: "ONLY" },
                             { num: "$10", lab: "BOOST" }, { num: "52", lab: "WEEKS" }, { num: "1", lab: "HABIT" }] } = {}) {
    const host = document.getElementById("cards");
    const cards = ITEMS.map((it) => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = it.img ? `<img src="${it.img}" alt="">`
        : `<span class="bar"></span><span class="num">${it.num}</span><span class="lab">${it.lab}</span>`;
      host.appendChild(c);
      return c;
    });
    const s = { a: 0, r: 0 };                           // a = ring angle (rad), r = burst 0→1
    function layout() {                                 // pure function of s → seek-safe
      cards.forEach((c, i) => {
        const ang = s.a + (i / cards.length) * Math.PI * 2;
        const depth = Math.sin(ang);                    // +1 nearest the camera
        const ringX = CX + Math.cos(ang) * RX, ringY = CY + depth * RY;
        const back = depth <= 0;
        gsap.set(c, {
          x: BURST[0] + (ringX - BURST[0]) * s.r,       // fly out of the hands
          y: BURST[1] + (ringY - BURST[1]) * s.r,
          scale: (0.6 + 0.2 * (depth + 1)) * (0.15 + 0.85 * s.r),
          rotation: Math.cos(ang) * -8,
          opacity: Math.min(1, s.r * 3),
          zIndex: back ? 1 : 3,                         // the sandwich: behind / in front of #fg
          filter: back ? `brightness(0.8) blur(${(-depth * 3).toFixed(2)}px)` : "none",
        });
      });
    }
    layout();
    const turns = (SPEED / 360) * DUR;
    tl.to(s, { a: -Math.PI * 2 * turns, duration: DUR, ease: "none", onUpdate: layout }, T);   // front travels R→L
    tl.to(s, { r: 1, duration: BURST_DUR, ease: "power3.out", onUpdate: layout }, T);
    tl.to(s, { r: 0, duration: 0.2, ease: "power2.in", onUpdate: layout }, T + DUR - 0.2);   // or hard-cut
  })();
</script>
